  note: >-
    Zoopla publishes no deprecation policy, no Sunset/Deprecation header support,
    and no notice period. What it does publish is the outcome of one: the public
    Zoopla listings API has been retired outright, announced in a single line on
    the front page of the developer docs — "The Zoopla listings API is no longer
    publicly available" — with a sales contact instead of a migration path. The
    legacy TIBCO Mashery portal that hosted it (developer.zoopla.co.uk) still
    resolves but no longer presents a valid certificate.
