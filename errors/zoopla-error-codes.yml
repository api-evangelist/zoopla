notes:
- >-
  The register is authoritative for the two activation APIs. The Leads API
  publishes no numeric error registry — it returns a generic `Error` object
  (see errors/zoopla-problem-types.yml) and documents 429 as a transient
  "service busy" signal that should be retried after a wait.
- >-
  Codes 1011003/1011004 and 2011004/2011005 are the duplicate-activation guard:
  Zoopla rejects a second activation for a listingId that already has a PENDING
  or ACTIVATED product rather than de-duplicating on an idempotency key.
