format: proprietary-numeric
envelope:
  shape: >-
    Errors are returned as a top-level `errors` array of objects, each with a
    human-readable `reason` and a numeric `code`. On an activation that was
    accepted but later failed asynchronously, the same array appears nested under
    `status.errors` on the activation resource, alongside `status.result: ERROR`.
  example_request_error: |
    {
      "errors": [
        {
          "reason": "There is already a premium listing pending for this listing ID",
          "code": 1011004
        }
      ]
    }
  example_async_error: |
    {
      "id": "5ecba691-84d6-4a60-9587-ca810292f5b0",
      "listingId": 123,
      "createdAt": "2020-07-20T12:35:38.049963+01:00",
      "updatedAt": "2020-07-20T12:35:38.049963+01:00",
      "status": {
        "result": "ERROR",
        "errors": [
          {"reason": "Listing ID doesn't exist", "code": 1011011}
        ]
      }
    }
code_scheme:
  description: >-
    A seven-digit code composed of a three-digit service identifier, a one-digit
    severity level (1 is the only level currently used), and a three-digit
    feature-scoped code.
  layout: SSS L NNN
  services:
  - code: '101'
    service: Premium Listings API
  - code: '102'
    service: Premium Listings Processor
  - code: '201'
    service: Weekly Featured Properties API
  ranges:
  - range: 001-010
    feature: Create activation
  - range: 011-020
    feature: Get activation(s)
  - range: 021-030
    feature: Update activation
  - range: 041-050
    feature: Premium Listing Plus (highlights) validation
  - range: 051-060
    feature: Listing JSON Service
  - range: 061-070
    feature: Listing Matching Service
  - range: 900-910
    feature: Internal service / permission errors
