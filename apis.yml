  - aid: zoopla:zoopla-premium-listing-activations-api
    name: Zoopla Premium Listing Activations API
    description: REST API that lets a member agent's CRM activate the Premium Listing product
      against a Zoopla listing, read the activation history for an account or a single listing_id,
      check whether a listing is premium at the moment of the call, and patch the highlights
      chart on an activation.
