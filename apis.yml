apis:
- aid: zoopla:zoopla-leads-api
  name: Zoopla Leads API
  description: Poll-based REST API used by Zoopla member agents to retrieve consumer
    leads generated on the portal. Applicant leads (buyers and renters enquiring on
    a property) and appraisal leads (owners asking for a valuation) are served from
    two separate endpoints with separate OAuth2 scopes. Lead data is retained for
    30 days. A real-time Push alternative delivers the same payloads to an endpoint
    you host.
  humanURL: https://developers.zoopla.co.uk/leads/reference/api
  baseURL: https://services.zoopla.co.uk
