name: Zoopla
kind: company
description: 'Zoopla Limited is one of the two dominant residential property portals in the
  United Kingdom, operating zoopla.co.uk alongside PrimeLocation under the Houseful group
  (formerly ZPG), which also owns the Alto/Jupix estate-agency CRM software and the Hometrack
  valuation and mortgage-risk business. In a market with no MLS and no cooperative listing
  standard, Zoopla sits at the demand end of the value chain — consumers search on the portal,
  and listings reach it from agency CRM systems rather than from a shared data pool. Its API
  posture reflects that position honestly: the old public Zoopla listings API on the Mashery-hosted
  developer.zoopla.co.uk portal has been retired and the site no longer serves a valid certificate,
  and the current developer documentation at developers.zoopla.co.uk states plainly that "the
  Zoopla listings API is no longer publicly available." What remains public is a small, real,
  machine-readable surface aimed at member estate agents and their CRM vendors — a Leads API
  for polling applicant and appraisal enquiries, a real-time lead Push service, and two product-activation
  APIs for Premium Listings and Weekly Featured Properties. The documentation and three Swagger/OpenAPI
  contracts are openly readable with no login, but credentials are not self-serve: you must
  already be a Zoopla member on a listings package, and client_id/client_secret are issued
  by Member Services after you send them a GPG public key. There is no RESO Web API or Data
  Dictionary certification, no OData $metadata document, and no Universal Property Identifier
  anywhere in Zoopla''s stack — RESO is a North American construct and the UK has not adopted
  it. Zoopla publishes no open data; the open property layer in the UK belongs to the public
  sector (HM Land Registry Price Paid and Ordnance Survey), not to the portals.'
