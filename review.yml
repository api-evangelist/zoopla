aid: zoopla
name: Zoopla
review:
  question: What is Zoopla's real, publicly reachable API surface, what does a
    developer have to sign or join to use it, and what is its RESO posture?
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: portal-marketplace
  primaryDomain: zoopla.co.uk
  summary: |
    Zoopla has a real, public, machine-readable developer surface — but it is
    not the one most people go looking for. The consumer listings API that
    third-party wrappers were built against is gone: developer.zoopla.co.uk
    still resolves (to zoopla.mashery.com, the legacy TIBCO Mashery portal)
    but no longer presents a valid certificate, and the current docs say
    outright that "the Zoopla listings API is no longer publicly available."
    What is live at developers.zoopla.co.uk is a docsify site, served from
    GitHub Pages out of the private zoopla-eng/zoopla-docs repo, last modified
    2026-06-08. It documents three APIs and one webhook service aimed squarely
    at member estate agents and the CRM vendors that integrate for them:
    a Leads poll API, a real-time lead Push service, and product-activation
    APIs for Premium Listings and Weekly Featured Properties. Three real
    Swagger/OpenAPI JSON contracts are downloadable anonymously and all three
    parse. Credentials are another matter entirely — see accessGate below.

resoPosture:
  certified: false
  posture: No RESO reference found anywhere in Zoopla's documentation, specs, or
    hosts; RESO is a North American (NAR/MLS) construct and the UK market has no
    MLS to certify against.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  directoryEvidence: |
    https://www.reso.org/certificates/ was fetched (HTTP 200) and contains no
    reference to Zoopla, Rightmove, or any United Kingdom organization.
    https://certification.reso.org/ returned HTTP 400 to an anonymous client.
    No RESO certification claim appears on any Zoopla property.
  odataEndpoint: none
  metadataDocument: |
    Probed https://services.zoopla.co.uk/$metadata (HTTP 404) and
    https://api.zoopla.co.uk/$metadata (HTTP 404). No OData service document or
    $metadata exists. Zoopla's contracts are plain REST described by Swagger 2.0
    and OpenAPI 3.0.0, not OData.
  universalPropertyIdentifier: |
    No UPI. Zoopla identifies listings with its own opaque identifiers — a
    `uuid` path parameter on activations, plus `listing_id` / `listingId`,
    `portalLeadId`, `portalBranchId`, `portalCompanyId`, `portalGroupId` and
    `sourceBranchId` in the leads payloads. Nothing maps to a RESO UPI.
  wordBoundaryGrep: |
    Case-insensitive word-boundary grep for RESO, OData, $metadata, and
    "Universal Property Identifier" across every harvested markdown page and
    all three JSON specs returned zero hits. The only near-matches were the
    substrings "Resource" (pl-spec.json) and "resolve" (terms-of-use).
  marketNote: |
    This is the expected UK answer and should not be read as a failing. The UK
    has no MLS and therefore no cooperative standard to certify against.
    Residential listings are controlled by two portals — Rightmove and Zoopla —
    and reach them through agency CRM software (Alto/Jupix, Reapit, Street,
    Apex27), not through a shared pool. There is no UK equivalent of a
    RESO-certified endpoint, so "certified but unreachable" does not apply here:
    there is simply no certification layer in this market at all.

accessGate:
  gate: membership-required
  gated: true
  selfServe: false
  whatYouMustSignOrJoin: |
    You must already be a Zoopla customer. The API Terms of Use answer the
    question "Who can use this feature?" with: "All Zoopla customers who are
    subscribed to a listings package with the relevant features." Using the API
    binds you to Zoopla's existing member contract, including the Zoopla member
    terms at https://www.zoopla.co.uk/members/terms/, and any products ordered
    through the activation APIs are charged under that contract at your
    contracted or prevailing rates. There is no developer signup form, no
    sandbox, no free tier, and no API key self-issuance anywhere on the site.
  credentialIssuance: |
    Credentials are issued by humans. You generate a 4096-bit RSA GPG key pair,
    export the public key and give it to your Zoopla technical contact; Zoopla
    emails back a plaintext client_id and a PGP-encrypted client_secret which
    you decrypt with your private key. Questions and revocation go to
    members@zoopla.co.uk. Onboarding for the leads services is explicitly
    "get in touch with us" via https://support.zoopla.co.uk/hc/en-gb.
  commercialContact: https://business.zoopla.co.uk/contact-us
  listingsDataNote: |
    For anything beyond these member product APIs — most importantly listings
    data — the README directs you to a commercial conversation:
    "The Zoopla listings API is no longer publicly available. If you have a
    commercial requirement and would like to discuss the availability of Zoopla
    data, including but not limited to the listings API, then please get in
    touch via https://business.zoopla.co.uk/contact-us". That path is
    partner-only and nothing about it is documented publicly.
  docsAreOpen: |
    Worth separating from the gate: the documentation and all three spec files
    are served anonymously with no login. The contracts are public even though
    the data behind them is not.

openData:
  publishesOpenData: false
  note: |
    Zoopla publishes no open, unlicensed, publicly callable dataset. Its
    portal-derived data (listings, sold prices, Zed-Index-style estimates) is
    proprietary and licensed commercially. The genuinely open UK property layer
    sits in the public sector instead — HM Land Registry Price Paid Data and
    Ordnance Survey open products — and is not operated by Zoopla. This is the
    inverse of the US arrangement: the UK has no industry standard, but it does
    have real open government property data, and none of it comes from the
    portals.

authModel:
  scheme: OAuth 2.0 client credentials (machine-to-machine)
  tokenEndpoint: https://services-auth.services.zoopla.co.uk/oauth2/token
  identityProvider: |
    Amazon Cognito. The sample access token published in the authentication docs
    carries iss = https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_g0qeZRnbT,
    which places the auth tier in AWS eu-west-1.
  clientAuthentication: HTTP Basic — base64(client_id:client_secret) in the
    Authorization header on the token request, form-encoded body with
    grant_type=client_credentials.
  tokenType: Bearer, expires_in 3600
  scopes:
    - name: api/api_access
      note: Coarse single scope used by both product-activation APIs (OpenAPI 3
        clientCredentials flow in pl-spec.json and wfp-spec.json).
    - name: leads/list:applicant-leads
      note: Grants read access to applicant lead lists (Swagger 2.0 OAuth2
        "application" flow in leads-poll.json).
    - name: leads/list:appraisal-leads
      note: Grants read access to appraisal lead lists.
  openidConfiguration: |
    Probed https://services-auth.services.zoopla.co.uk/.well-known/openid-configuration
    anonymously — HTTP 404. No OIDC discovery document is served at the
    documented token host.
  errorCodes: HTTP 401 or 403 on an invalid or expired token.
  inboundVsOutbound: |
    The Push service inverts the auth relationship: Zoopla is the client and you
    are the server. You supply a token endpoint plus client_id/client_secret
    (client_credentials only) that Zoopla calls to mint a token, or a static API
    key that Zoopla sends verbatim as the Authorization header value.

apiFamily:
  segmentationUsedByTheDocs:
    - Leads (applicant leads and appraisal leads; poll and push delivery)
    - Premium Products / activations (Premium Listings, Weekly Featured Properties)
  listingsSearch: not available publicly — retired
  propertyRecords: not available publicly
  valuationAVM: |
    Not exposed by Zoopla itself. Valuation and mortgage-risk products live in a
    sibling Houseful brand, Hometrack (and Calcasa in the Netherlands), sold to
    lenders rather than published as a developer API.
  transactions: |
    Not on this portal. Transaction/onboarding workflow sits in the Alto Software
    Group side of Houseful (Alto, Jupix, Yourkeys), not in Zoopla's developer docs.
  tenancy: not documented
  payments: |
    No payments API. Product activations are billed against the member's existing
    Zoopla contract rather than settled through an API.

