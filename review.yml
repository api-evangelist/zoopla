portalRoutingNote: |
  developers.zoopla.co.uk runs docsify with routerMode "history" on GitHub
  Pages. Deep links such as /pages/authentication therefore return HTTP 404 at
  the CDN while serving the full SPA shell, which then renders the correct page
  client-side. Those URLs are correct for a human in a browser but will look
  like 404s to a link checker; the underlying markdown at the same path plus
  ".md" returns a true 200 and was what this review harvested.

webhooksEventsSdksPostman:
  webhooks: |
    Yes, and they are real. The Lead Push Service POSTs one HTTP request per
    lead to an endpoint you host, distinguished by a top-level "applicant" or
    "appraisal" key, with configurable filters for applicant / appraisal /
    sales / lettings. It retries for 24 hours against an unavailable consumer
    and retains leads for 30 days total, with no self-service replay after the
    retry window. Documented at
    https://developers.zoopla.co.uk/leads/docs/push-service.
  events: No event bus, no streaming, no AsyncAPI document, no WebSocket surface.
  sdks: None published by Zoopla. The Python and Node wrappers on GitHub and
    PyPI are third-party and target the retired public listings API.
  postman: No official Postman collection or workspace found.
  changelog: None published on the developer portal.
  statusPage: status.zoopla.co.uk exists but returned 403 anonymously; not
    referenced from the developer docs.
  rateLimits: Not documented anywhere in the portal or the specs.
  sandbox: None. The specs document a single production host,
    services.zoopla.co.uk, and the leads spec labels it "Production URL".

findings:
  - The public listings API is genuinely retired, and Zoopla says so in its own
    words on the front page of its developer docs.
  - Three real machine-readable contracts survive and are downloadable without
    authentication; all three parse. Two are OpenAPI 3.0.0, one is Swagger 2.0.
  - Every one of them describes a member-facing commerce or lead-delivery
    surface. Not one of them returns property listing content.
  - Auth is a well-formed OAuth 2.0 client-credentials setup on Amazon Cognito
    with distinct, resource-scoped strings for leads — better hygiene than the
    single coarse api/api_access scope on the activation APIs.
  - The GPG-encrypted client_secret handoff is unusual in 2026 and is the
    clearest signal that onboarding is a manual, relationship-mediated process
    rather than a developer product.
  - "Absence is a finding: no RESO, no OData, no UPI, no SDKs, no Postman, no
    changelog, no sandbox, no published rate limits, no OIDC discovery."
  - The corporate structure matters for anyone mapping the UK stack. Houseful
    owns both the portal (Zoopla) and a major agency CRM group (Alto/Jupix),
    which means the same parent sits on both sides of the listing pipe that
    substitutes for an MLS in this market.

