  third_party_packages: 5
  note: >-
    Zoopla publishes no first-party client library in any language. The
    developer portal documents raw HTTP + OAuth 2.0 client-credentials only, and
    the two public GitHub organisations (zoopla-eng, zoopla) contain no SDK — only
    an org profile repo, a technical-interview starter, and a forked C# style
    guide. Every package found on a public registry is community-built and all of
    them target the retired public Zoopla listings API, so they no longer work
    against a live Zoopla surface. The one artifact Zoopla does publish for
    getting started is a Postman collection, catalogued at
    postman/zoopla-products-api.postman_collection.json.
