identifiers:
- field: id
  form: uuid
  scope: leads and activations
- field: listingId
  form: integer
  scope: Zoopla listing identifier used by both activation APIs
- field: customerListingId
  form: string
  scope: >-
    The agent's own listing identifier, resolved to a listingId by the internal
    Listing Matching Service (errors 1011061-1011066). Mutually exclusive with
    listingId.
- field: uprn
  form: integer
  scope: >-
    UK Unique Property Reference Number (Ordnance Survey / GeoPlace) on both
    ListingDetails and Property — the only cross-industry property identifier
    present anywhere in Zoopla's contracts.
- field: portalBranchId / portalCompanyId / portalGroupId / sourceBranchId
  form: string
  scope: >-
    Zoopla's internal agency hierarchy, which doubles as the filter dimension on
    the Leads poll endpoints (branch-id, company-id, group-id).
