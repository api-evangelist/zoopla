enumeration_note: >-
  All enumerations are SCREAMING_SNAKE strings prefixed with their domain
  (APPLICANT_INTENT_BUY, LIFE_CYCLE_STATUS_FOR_SALE, CONFIDENCE_BAND_HIGH). The
  Push docs warn new members can be added at any time, so consumers must treat
  every enum as open.
