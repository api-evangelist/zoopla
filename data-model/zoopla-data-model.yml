summary: >-
  Two disjoint object graphs sit behind one host. The Leads graph is a rich
  read-only projection of a consumer enquiry — an Applicant or Appraisal lead
  that carries a Contact, and either the ListingDetails the enquiry was made
  against (applicant) or the Property being appraised (appraisal). The
  activations graph is a small write-then-poll graph — an activation resource
  keyed by uuid, pointing at a listing by integer listingId, carrying a Status
  and, for Premium Listings, a Highlights collection. Nothing joins the two
  graphs in the public contracts: leads reference listings by
  listingDetails.id / propertyId, activations reference them by listingId, and
  no operation resolves one to the other.
entities:
- name: Applicant
  domain: leads
  spec: openapi/zoopla-leads-api-openapi.json
  identifier: id (uuid)
  description: >-
    A consumer enquiring about buying or renting a property, delivered by poll
    (GET /applicant-leads) or push. Carries intent, enquiryType, message,
    viewing preferences and the search criteria behind the enquiry.
  foreign_keys: [portalLeadId, portalBranchId, portalCompanyId, portalGroupId, sourceBranchId]
- name: Appraisal
  domain: leads
  spec: openapi/zoopla-leads-api-openapi.json
  identifier: id (uuid)
  description: >-
    A consumer asking for a valuation on a property they own, delivered by poll
    (GET /appraisal-leads) or push. Carries intent, justCurious, urgency and the
    Property being appraised.
  foreign_keys: [portalLeadId, portalBranchId, portalCompanyId, portalGroupId, sourceBranchId]
- name: Contact
  domain: leads
  identifier: null
  description: Name, email, phone and contact-method/time preferences of the consumer.
- name: ContactPreferences
  domain: leads
  description: Preferred contact method and time-of-day window.
- name: ListingDetails
  domain: leads
  identifier: id
  description: >-
    The Zoopla listing an applicant lead was raised against — bedrooms,
    bathrooms, lifecycle status, address, pricing, images and uprn.
- name: Property
  domain: leads
  identifier: propertyId
  description: >-
    The property behind an appraisal lead — size, tenure, energy rating, an
    automated Estimate, last sale price, coordinates and uprn.
- name: Estimate
  domain: leads
  description: Automated valuation with lower/upper range, value, confidence and confidence band.
- name: SearchCriteria
  domain: leads
  description: The consumer's search at the moment of enquiry — location, radius, bedrooms, price band, property type.
- name: PremiumListing
  domain: activations
  spec: openapi/zoopla-premium-listing-activations-openapi.json
  identifier: id (uuid, path parameter `uuid`)
  description: >-
    A request to activate the Premium Listing product against a listing.
    Created 202 PENDING, resolves to ACTIVATED (with expiryAt) or ERROR.
  foreign_keys: [listingId, customerListingId]
- name: WeeklyFeaturedProperty
  domain: activations
  spec: openapi/zoopla-weekly-featured-property-activations-openapi.json
  identifier: id (uuid, path parameter `uuid`)
  description: >-
    A request to activate the Weekly Featured Property product against a
    listing. Same PENDING/ACTIVATED/ERROR lifecycle, plus isRenewable and an
    optional customDetails object.
  foreign_keys: [listingId]
- name: Status
  domain: activations
  description: >-
    result (PENDING | ACTIVATED | ERROR), an optional `currently` in-flight
    marker (WAITING_FOR_UPDATE) and an errors array on failure.
- name: Highlight
  domain: activations
  identifier: id (integer, from the published highlights chart)
  description: A Premium Listing Plus highlight with an optional free-text description.
